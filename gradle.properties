# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.uniquePackageNames=false
android.r8.strictFullModeForKeepRules=false
android.dependency.useConstraints=true
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
# Required: project declares kotlin.android plugin explicitly; removing causes "extension already
# registered" conflict with AGP built-in Kotlin. Remove both lines when upgrading to AGP 10+
# by also dropping alias(libs.plugins.kotlin.android) from build.gradle.kts.
android.builtInKotlin=false
android.newDsl=false
