# Builds an unsigned release AAB and uploads it as a downloadable Actions artifact.
# Used to unblock Play Console IAP product creation (BILLING present). Parent signs with upload key.
name: Upload Internal AAB

on:
  workflow_dispatch:
  push:
    branches:
      - "cursor/aletheia-beta-crewtools-4637"
    paths:
      - ".github/workflows/upload-internal-aab.yml"
      - "app/build.gradle.kts"
      - "app/src/main/AndroidManifest.xml"
      - "gradle/**"
      - "docs/PLAY_INTERNAL_UPLOAD.md"

concurrency:
  group: upload-internal-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android command-line tools + platform 36
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_HOME" > "$GITHUB_WORKSPACE/local.properties"

      - name: Stub google-services.json (packaging only — not a production secret)
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "0",
              "project_id": "flighttimeapp-6f816",
              "storage_bucket": "flighttimeapp-6f816.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:0:android:ci",
                  "android_client_info": {
                    "package_name": "it.grg.flighttimeapp"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyC00000000000000000000000000000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Grant Gradle
        run: chmod +x gradlew

      - name: Bundle unsigned release AAB (skip native llama for CI speed; BILLING retained)
        # Skip NDK/llama.cpp so the job finishes without NDK; Play only needs BILLING to unlock products.
        run: ./gradlew :app:bundleRelease --no-daemon -PaletheiaSkipNative=true

      - name: Name + checksum AAB
        run: |
          SRC=app/build/outputs/bundle/release/app-release.aab
          NAME=FlightTimeApp-it.grg.flighttimeapp-v1.12.15-vc37-release-unsigned.aab
          mkdir -p out
          cp "$SRC" "out/$NAME"
          sha256sum "out/$NAME" | tee "out/$NAME.sha256"
          ls -lh "out/$NAME"
          jarsigner -verify "out/$NAME" 2>&1 | tail -5 || true

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: flighttime-internal-aab-unsigned
          path: |
            out/*.aab
            out/*.sha256
          if-no-files-found: error
          retention-days: 14
